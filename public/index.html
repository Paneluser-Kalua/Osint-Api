<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kalua OSINT Pro Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #030305;
      --primary: #00f0ff;
      --secondary: #8a2be2;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-dim: #8b8b99;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Space Grotesk', sans-serif; -webkit-tap-highlight-color: transparent; }

    body, html {
      width: 100%;
      height: 100dvh;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      position: fixed;
      touch-action: none;
    }

    .bg-glow {
      position: absolute;
      width: 150vw; height: 150vw;
      background: radial-gradient(circle, rgba(138,43,226,0.15) 0%, rgba(0,240,255,0.05) 40%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      animation: breathe 8s infinite alternate ease-in-out;
    }
    @keyframes breathe { 0% { transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(-50%, -50%) scale(1.1); } }

    .glass {
      background: var(--surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* Lock Screen */
    #lockUI {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: var(--bg);
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    .lock-card {
      width: 100%;
      max-width: 320px;
      padding: 30px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .lock-card h1 { font-size: 28px; font-weight: 700; background: linear-gradient(90deg, var(--primary), var(--secondary)); -webkit-background-clip: text; color: transparent; }
    
    .input-box {
      width: 100%;
      padding: 16px;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 15px;
      text-align: center;
      outline: none;
      transition: 0.3s;
    }
    .input-box:focus { border-color: var(--primary); box-shadow: 0 0 12px rgba(0,240,255,0.2); }
    
    .btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }

    /* Main UI */
    #appUI {
      display: none;
      flex-direction: column;
      height: 100dvh;
      padding: clamp(15px, 4vh, 24px) 20px;
      gap: clamp(12px, 3vh, 20px);
    }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .header h2 { font-size: 20px; font-weight: 700; }
    .badge { background: rgba(0,240,255,0.1); color: var(--primary); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(0,240,255,0.2); text-decoration: none; }
    .wa-badge { background: rgba(37, 211, 102, 0.1); color: #25D366; border-color: rgba(37, 211, 102, 0.3); display: flex; align-items: center; gap: 6px; }

    .main-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(20px, 4vh, 24px);
      gap: clamp(15px, 3vh, 20px);
    }

    .segments { display: flex; background: rgba(0,0,0,0.5); border-radius: 14px; padding: 5px; border: 1px solid var(--border); }
    .seg-btn { flex: 1; padding: 12px 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-dim); border-radius: 10px; cursor: pointer; transition: 0.3s; }
    .seg-btn.active { background: var(--surface); color: var(--text); border: 1px solid var(--border); }

    #formView { display: flex; flex-direction: column; gap: clamp(12px, 2.5vh, 16px); height: 100%; justify-content: center; }
    #resultView { display: none; flex-direction: column; gap: 16px; height: 100%; justify-content: center; animation: slideUp 0.3s ease; }
    
    .result-box { background: rgba(0,0,0,0.4); border: 1px solid rgba(0,240,255,0.3); border-radius: 14px; padding: 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .res-data { flex: 1; overflow: hidden; }
    .res-label { font-size: 11px; color: var(--primary); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }
    .res-value { font-family: monospace; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    .copy-btn { background: var(--surface); border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer; }

    .footer-info {
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      padding: 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .footer-info .dev-name { color: #ffffff; font-weight: 700; }
    .footer-info .endpoint-text { font-family: monospace; color: var(--primary); margin-top: 6px; display: block; font-size: 10px; }

    @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-height: 550px) {
      .header, .footer-info { display: none !important; }
      #appUI { padding: 10px; }
      .main-card { padding: 15px; }
    }
  </style>
</head>
<body>

<div class="bg-glow"></div>

<!-- LOCK SCREEN -->
<div id="lockUI">
  <div class="glass lock-card">
    <h1>KALUA HUB</h1>
    <input type="password" id="passInput" class="input-box" placeholder="Access Code" inputmode="text" onkeydown="if(event.key==='Enter')unlock()">
    <button class="btn" onclick="unlock()" id="unlockBtn">Enter Hub</button>
  </div>
</div>

<!-- MAIN APP UI -->
<div id="appUI">
  <div class="header">
    <h2>KALUA<span style="color:var(--primary)"> OSINT </span></h2>
    <a href="https://whatsapp.com/channel/0029Vb8gGXN9hXEzc1v9Hn2I" target="_blank" class="badge wa-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      Join Channel
    </a>
  </div>

  <div class="glass main-card">
    <div id="formView">
      <div class="segments">
        <div class="seg-btn active" onclick="setPlan(this, '2d')">2 Days</div>
        <div class="seg-btn" onclick="setPlan(this, '3d')">3 Days</div>
        <div class="seg-btn" onclick="setPlan(this, 'life')">Lifetime</div>
      </div>

      <input type="text" id="devName" class="input-box" placeholder="Your Username" autocomplete="off">
      <input type="tel" id="testNum" class="input-box" placeholder="Demo Number (9060793014)" value="9060793014" autocomplete="off">
      
      <button class="btn" onclick="generate()" style="margin-top: 5px;">Create Access Key</button>
    </div>

    <div id="resultView">
      <h3 style="color:var(--primary); text-align:center; font-size:18px;">Key Generated</h3>
      
      <div class="result-box">
        <div class="res-data">
          <div class="res-label">API Key</div>
          <div class="res-value" id="valKey">...</div>
        </div>
        <button class="copy-btn" onclick="copyData('valKey', this)">Copy</button>
      </div>

      <div class="result-box">
        <div class="res-data">
          <div class="res-label">Ready Endpoint</div>
          <div class="res-value" id="valUrl">...</div>
        </div>
        <button class="copy-btn" onclick="copyData('valUrl', this)">Copy</button>
      </div>

      <button class="btn" onclick="resetUI()" style="background: var(--surface); color: var(--text); border: 1px solid var(--border); margin-top: 10px;">Create Another</button>
    </div>
  </div>

  <div class="footer-info">
    Developer: <span class="dev-name">Sahani Satyam</span>
    <span class="endpoint-text">GET /api/number/:key?number=</span>
  </div>
</div>

<script>
const PASS = "KaluaApiAdmin";
const SESSION = "kalua_pro_auth_v2";
let activePlan = '2d';

const vibe = (ms) => { if(navigator.vibrate) navigator.vibrate(ms); };

window.onload = () => {
  if (sessionStorage.getItem(SESSION) === "true") {
    document.getElementById('lockUI').style.display = 'none';
    document.getElementById('appUI').style.display = 'flex';
  }
};

function unlock() {
  const input = document.getElementById('passInput');
  const btn = document.getElementById('unlockBtn');
  
  if(input.value === PASS) {
    vibe(50);
    sessionStorage.setItem(SESSION, "true");
    btn.innerHTML = "VERIFIED ✓";
    btn.style.background = "var(--primary)";
    btn.style.color = "#000";
    setTimeout(() => {
      document.getElementById('lockUI').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('lockUI').style.display = 'none';
        document.getElementById('appUI').style.display = 'flex';
      }, 300);
    }, 400);
  } else {
    vibe([100, 50, 100]);
    input.value = "";
    input.placeholder = "Wrong Code!";
    input.style.borderColor = "#ff4444";
    setTimeout(() => input.style.borderColor = "var(--border)", 1000);
  }
}

function setPlan(el, plan) {
  vibe(30);
  document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  activePlan = plan;
}

function generate() {
  const user = document.getElementById('devName').value.trim() || 'DEV';
  const num = document.getElementById('testNum').value.trim() || '9060793014';
  
  const rand = Math.random().toString(36).slice(2, 7).toUpperCase();
  const pre = activePlan === 'life' ? 'LIFE' : activePlan === '3d' ? 'D3' : 'D2';
  
  const finalKey = `KALUA-${pre}-${user.slice(0,5).toUpperCase()}-${rand}`;
  const finalUrl = `${window.location.origin}/api/number/${finalKey}?number=${encodeURIComponent(num)}`;

  document.getElementById('valKey').innerText = finalKey;
  document.getElementById('valUrl').innerText = finalUrl;

  document.getElementById('formView').style.display = 'none';
  document.getElementById('resultView').style.display = 'flex';
  vibe([50, 50, 50]);
}

function resetUI() {
  vibe(30);
  document.getElementById('resultView').style.display = 'none';
  document.getElementById('formView').style.display = 'flex';
}

function copyData(id, btn) {
  const txt = document.getElementById(id).innerText;
  navigator.clipboard.writeText(txt).then(() => {
    vibe(40);
    const oldTxt = btn.innerText;
    btn.innerText = "COPIED";
    btn.style.background = "var(--primary)";
    btn.style.color = "#000";

    setTimeout(() => {
      btn.innerText = oldTxt;
      btn.style.background = "var(--surface)";
      btn.style.color = "var(--text)";
    }, 1500);
  }).catch(() => {
    // Fallback for older browsers
    const temp = document.createElement("textarea");
    temp.value = txt;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    document.body.removeChild(temp);
  });
}
</script>

</body>
</html>
